<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>EON · Workspace — Epal ERP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2322a3c4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='800' font-size='30' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
  <style>
    /* ============================================================
       EON · Workspace — the ERP and EON side by side.

       The ERP lives in the left frame and navigates as much as it
       likes; EON lives in the right frame and is never reloaded, so
       the conversation, the scroll position and the voice session
       survive every page change on the left. That is the whole point
       of the split: EON keeps the thread while the ERP moves.
       ============================================================ */
    :root {
      --bg: #eef1f7; --panel: #fff; --line: #e2e7f0; --text: #131a2e; --muted: #5b6785;
      --primary: #4f46e5; --bar: 44px; --gap: 8px; --radius: 14px;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans Bengali", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); }

    .shell { display: grid; grid-template-rows: var(--bar) 1fr; height: 100dvh; }

    /* ---- top bar: where the ERP is, and the controls ---- */
    .bar { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: .2px; }
    .logo { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800;
            background: conic-gradient(from 210deg, #4f46e5, #22a3c4, #6d28d9, #4f46e5); }
    .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 9px; height: 30px; min-width: 30px;
           padding: 0 9px; cursor: pointer; font: 500 13px var(--font); display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #f5f7fc; }
    .btn:active { transform: translateY(1px); }
    .btn.on { background: rgba(79,70,229,.1); border-color: rgba(79,70,229,.35); color: var(--primary); font-weight: 600; }
    .where { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: #f5f7fc; border: 1px solid var(--line);
             border-radius: 9px; height: 30px; padding: 0 10px; color: var(--muted); font-size: 12.5px; }
    .where b { color: var(--text); font-weight: 600; }
    .where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint { color: var(--muted); font-size: 12px; }
    kbd { font: 600 11px var(--font); background: #f0f2f8; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; color: var(--muted); }

    /* ---- the two frames ---- */
    .split { display: grid; grid-template-columns: 1fr 6px var(--panel-w, 420px); height: 100%; padding: var(--gap); gap: 0; }
    .split.collapsed { grid-template-columns: 1fr 0 0; }
    .pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; box-shadow: 0 1px 2px rgba(19,26,46,.04); }
    .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .grip { cursor: col-resize; display: grid; place-items: center; }
    .grip::after { content: ""; width: 3px; height: 44px; border-radius: 3px; background: #cfd6e4; transition: background .15s; }
    .grip:hover::after, .grip.dragging::after { background: var(--primary); }
    .split.collapsed .grip { display: none; }

    /* while dragging, the frames must not swallow the mouse */
    .dragging-overlay { position: fixed; inset: 0; z-index: 99; cursor: col-resize; display: none; }
    body.dragging .dragging-overlay { display: block; }

    /* ---- a slim tab to bring EON back when collapsed ---- */
    .reopen { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 60; display: none;
              writing-mode: vertical-rl; background: linear-gradient(135deg, #4f46e5, #2f8bff); color: #fff; border: 0;
              padding: 14px 7px; border-radius: 10px 0 0 10px; cursor: pointer; font: 600 12px var(--font); letter-spacing: .4px;
              box-shadow: 0 6px 18px rgba(31,109,255,.35); }
    .split.collapsed ~ .reopen { display: block; }

    /* ---- narrow screens: stack, one at a time ---- */
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      .split .grip { display: none; }
      .split .pane.eon { position: fixed; inset: calc(var(--bar) + 8px) 8px 8px 8px; z-index: 70; }
      .split.collapsed .pane.eon { display: none; }
    }
    @media print { .bar, .pane.eon, .grip { display: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="brand"><span class="logo">E</span> EON <span class="hint">· workspace</span></div>
      <span class="sep"></span>
      <button class="btn" id="back" title="Back (Alt+←)">←</button>
      <button class="btn" id="fwd" title="Forward (Alt+→)">→</button>
      <button class="btn" id="reload" title="Reload the ERP only">⟳</button>
      <div class="where"><b>ERP</b><span id="where">loading…</span></div>
      <button class="btn" id="full" title="Open this ERP page in a full tab">Full tab ↗</button>
      <span class="sep"></span>
      <button class="btn on" id="toggle" title="Show or hide EON (Ctrl+\)">EON panel</button>
      <span class="hint">Ctrl+<kbd>\</kbd></span>
    </div>

    <div class="split" id="split">
      <div class="pane erp"><iframe id="erp" title="Epal ERP" src="about:blank" allow="microphone; clipboard-write"></iframe></div>
      <div class="grip" id="grip" title="Drag to resize · double-click to reset"></div>
      <div class="pane eon"><iframe id="eon" title="EON" src="./?dock=1#ask" allow="microphone; clipboard-write"></iframe></div>
    </div>
    <button class="reopen" id="reopen">EON ▸</button>
    <div class="dragging-overlay" id="overlay"></div>
  </div>

  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const split = $('split'), erp = $('erp'), eon = $('eon');
    const ORIGIN = location.origin;

    /* ---------- which ERP page to start on ---------- */
    const params = new URLSearchParams(location.search);
    const start = params.get('to') || sessionStorage.getItem('eon_ws_last') || '/';
    const safe = (u) => {
      try {
        const url = new URL(u, ORIGIN);
        if (url.origin !== ORIGIN) return null;                 // this shell only ever frames our own ERP
        if (/^\/(eon|embed|server|app|ai-companion|deploy)(\/|$)/.test(url.pathname)) return null;
        return url.pathname + url.search + url.hash;
      } catch { return null; }
    };
    erp.src = safe(start) || '/';

    /* ---------- the divider ---------- */
    const W_KEY = 'eon_ws_width';
    const setW = (px) => {
      const w = Math.max(320, Math.min(Math.round(window.innerWidth * 0.6), px));
      split.style.setProperty('--panel-w', w + 'px');
      try { localStorage.setItem(W_KEY, String(w)); } catch {}
    };
    setW(parseInt(localStorage.getItem(W_KEY) || '', 10) || 420);

    let dragging = false;
    $('grip').addEventListener('mousedown', (e) => { dragging = true; document.body.classList.add('dragging'); $('grip').classList.add('dragging'); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => { if (dragging) setW(window.innerWidth - e.clientX - 8); });
    window.addEventListener('mouseup', () => { dragging = false; document.body.classList.remove('dragging'); $('grip').classList.remove('dragging'); });
    $('grip').addEventListener('dblclick', () => setW(420));

    /* ---------- show / hide EON ---------- */
    const setOpen = (open) => {
      split.classList.toggle('collapsed', !open);
      $('toggle').classList.toggle('on', open);
      try { localStorage.setItem('eon_ws_open', open ? '1' : '0'); } catch {}
    };
    setOpen((localStorage.getItem('eon_ws_open') || '1') === '1');
    $('toggle').addEventListener('click', () => setOpen(split.classList.contains('collapsed')));
    $('reopen').addEventListener('click', () => setOpen(true));
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === '\\') { e.preventDefault(); setOpen(split.classList.contains('collapsed')); }
      if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back(); }
      if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); fwd(); }
    });

    /* ---------- ERP frame controls ----------
       Same origin, so history works; if a page ever blocks access we
       fall back to reloading the frame rather than breaking. */
    const back = () => { try { erp.contentWindow.history.back(); } catch { erp.src = erp.src; } };
    const fwd = () => { try { erp.contentWindow.history.forward(); } catch {} };
    $('back').addEventListener('click', back);
    $('fwd').addEventListener('click', fwd);
    $('reload').addEventListener('click', () => { try { erp.contentWindow.location.reload(); } catch { erp.src = erp.src; } });
    $('full').addEventListener('click', () => { const p = currentPath(); if (p) window.open(ORIGIN + p, '_blank', 'noopener'); });

    function currentPath() {
      try { const l = erp.contentWindow.location; return l.pathname + l.search + l.hash; } catch { return null; }
    }

    /* ---------- tell EON where the boss is looking ----------
       Every ERP navigation posts the new address (and the page title)
       into EON's frame, so it can answer "what am I looking at" and
       offer actions for the record on screen — without EON reloading. */
    function announce() {
      const path = currentPath();
      let title = '';
      try { title = erp.contentWindow.document.title || ''; } catch {}
      $('where').textContent = path || '(loading)';
      if (path) { try { sessionStorage.setItem('eon_ws_last', path); } catch {} }
      try {
        eon.contentWindow.postMessage({ type: 'eon:erp-context', path, title, at: Date.now() }, ORIGIN);
      } catch {}
    }
    erp.addEventListener('load', announce);
    // a same-origin SPA-ish navigation may not fire load; poll cheaply as a safety net
    let lastSeen = null;
    setInterval(() => { const p = currentPath(); if (p && p !== lastSeen) { lastSeen = p; announce(); } }, 800);

    /* ---------- EON drives the ERP ----------
       The panel asks the shell to navigate; the shell validates the
       address, moves the LEFT frame only, and never touches itself. */
    window.addEventListener('message', (e) => {
      if (e.origin !== ORIGIN || !e.data || typeof e.data !== 'object') return;
      const { type, url } = e.data;
      if (type === 'eon:navigate') {
        const path = safe(url);
        if (!path) return;
        try { erp.contentWindow.location.assign(ORIGIN + path); } catch { erp.src = ORIGIN + path; }
        setOpen(true);
      } else if (type === 'eon:collapse') {
        setOpen(false);
      } else if (type === 'eon:width' && Number(e.data.px)) {
        setW(Number(e.data.px));
      } else if (type === 'eon:where') {
        try { e.source.postMessage({ type: 'eon:erp-context', path: currentPath(), title: '', at: Date.now() }, ORIGIN); } catch {}
      }
    });

    /* the API the panel (and the companion inside the ERP) can call directly */
    window.EonWorkspace = {
      navigate: (u) => { const p = safe(u); if (p) { try { erp.contentWindow.location.assign(ORIGIN + p); } catch { erp.src = ORIGIN + p; } setOpen(true); } return !!p; },
      current: currentPath,
      reload: () => { try { erp.contentWindow.location.reload(); } catch {} },
      open: setOpen,
      isWorkspace: true,
    };
  })();
  </script>
</body>
</html>
