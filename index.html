<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>EON · Epal Group</title>
  <!-- The ERP owns this address (see .htaccess → erp/public). This page is only
       reached before the ERP is installed here; it sends you to EON's panel. -->
  <meta http-equiv="refresh" content="0; url=./eon/">
  <link rel="canonical" href="./eon/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #131a2e;
           font: 15px/1.6 "Inter", "Segoe UI", system-ui, sans-serif; }
    .card { text-align: center; padding: 32px 40px; }
    .logo { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 16px; display: grid; place-items: center;
            background: conic-gradient(from 210deg, #4f46e5, #22a3c4, #6d28d9, #4f46e5); color: #fff; font-weight: 800; font-size: 24px; }
    a { color: #4f46e5; }
    p { color: #5b6785; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <h1>EON</h1>
    <p>One Brain · Multi Decision Layer</p>
    <p><a href="./eon/">Open EON's panel →</a></p>
  </div>
</body>
</html>
