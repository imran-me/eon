<!doctype html>
<!-- EON back wall — ONE design for the whole 5.9ft x 8.33ft panel.
     Printed to exact size by print-back.mjs.

     Geometry from the organiser's render + arithmetic, not guesswork:
       wall            70.8 x 99.96 in  (5.9 x 8.33 ft)
       43" TV          38 x 21.5 in, TOP RIGHT, per the owner's markup
                       (30 in branding strip + 38 in TV = 68 of 70.8,
                        leaving 1.4 in each side)
     The TV sits inside a dark header band, so the screen bezel reads as part
     of the design and a mount a few inches out still covers nothing but band.

     Vertical policy, per the owner: the work lives between the top and the
     middle. Staff stand at the wall, so nothing below ~85 in carries meaning.
     The QR is deliberately at ~3.2 ft off the floor, not at the foot of the
     panel, because that is where a standing visitor can point a phone.

     ?guide=1 overlays the reserved TV zone for checking. Never print that. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>EON back wall</title>
<style>
  :root{
    --ink:#0B1222; --band:#0E1A33; --band2:#16274A;
    --slate:#46536F; --blue:#2F62D9; --teal:#0E86A6; --lime:#AAE545;
    --soft:#F2F6FC; --line:#D7E1F1;
    --bleed:1in;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  @page{margin:0;}
  html,body{background:#fff;}
  body{
    font-family:Inter,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .wall{position:relative; overflow:hidden; background:#fff;}

  /* dark header band, full bleed, carrying the branding and the TV */
  .header{
    position:absolute; left:0; right:0; top:0; height:29in;
    background:linear-gradient(170deg, #FFFFFF 0%, #F6F9FE 100%);
    border-bottom:2px solid var(--line);
  }
  /* quiet wash low down: fills the standing zone, carries no information */
  .wash{
    position:absolute; left:0; right:0; bottom:0; height:30in;
    background:linear-gradient(to bottom, rgba(242,246,252,0), #F2F6FC 70%, #EAF1FA 100%);
  }
  .ghost{position:absolute; right:-12in; bottom:-14in; width:54in; height:54in; opacity:.55;}

  .safe{position:absolute; inset:var(--bleed);}
  .abs{position:absolute;}

  .word{font-weight:900; letter-spacing:-.055em; line-height:.86; color:var(--ink);}
  .mark{display:flex; align-items:center; gap:.95in;}
  .pill{
    display:inline-block; border:3px solid var(--line); border-radius:999px;
    padding:.34in 1.0in; font-size:.78in; font-weight:800;
    letter-spacing:.05em; color:var(--teal); white-space:nowrap; background:#fff;
  }
  .chip{display:inline-block; line-height:0;}
  .chip img{height:3.8in; width:auto; display:block;}

  .hero{font-weight:900; letter-spacing:-.03em; line-height:1.06; font-size:2.70in;}
  .hero .t{color:var(--blue);}
  .sub{color:var(--slate); font-weight:500; line-height:1.44; font-size:1.00in;}
  .bn{font-family:"Noto Sans Bengali","Nirmala UI",sans-serif;}

  h2.sec{
    font-size:1.12in; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
    color:var(--teal); margin-bottom:.85in;
  }
  ul.feat{list-style:none; display:flex; flex-direction:column; gap:.50in;}
  ul.feat li{
    position:relative; padding-left:1.55in; font-size:.98in;
    font-weight:600; line-height:1.3;
  }
  ul.feat li::before{
    content:""; position:absolute; left:0; top:.34in;
    width:.78in; height:.78in; border-radius:50%;
    background:var(--blue);
  }
  .note{
    background:var(--soft); border-left:.34in solid var(--blue);
    border-radius:.3in; padding:1.1in 1.25in;
    font-size:1.02in; line-height:1.42; font-weight:500; color:#2A3651;
  }
  .note b{color:var(--ink); font-weight:800;}

  .stats{display:flex; gap:1.0in;}
  .stat{flex:1;}
  .stat b{display:block; color:var(--blue); font-weight:900; font-size:3.5in;
          line-height:.88; letter-spacing:-.05em;}
  .stat span{display:block; font-size:.86in; font-weight:600; line-height:1.26;
             color:var(--slate); margin-top:.3in;}

  /* EON speaking: a bubble above the figure, tail pointing down at it */
  .bubble{
    position:relative; background:#fff; border:3px solid var(--line);
    border-radius:.65in; padding:.78in .9in;
    font-size:1.00in; font-weight:700; line-height:1.34;
    box-shadow:0 .16in .5in rgba(14,26,51,.10);
  }
  .bubble.dark{background:#fff; border-color:transparent;}
  .bubble::after,.bubble::before{
    content:""; position:absolute; left:3.0in; bottom:-.52in;
    border:.52in solid transparent; border-top-color:var(--line); border-bottom:0;
  }
  .bubble::before{bottom:-.44in; border-top-color:#fff; z-index:1;}
  .bubble.notail::after,.bubble.notail::before{display:none;}
  .bubble .sm{display:block; font-size:.82in; font-weight:600; color:var(--slate); margin-top:.3in;}

  .qrbox{display:flex; align-items:center; gap:1.1in;}
  .qr{display:block; width:6.6in; height:6.6in; border:3px solid var(--line);
      border-radius:.3in; padding:.24in; background:#fff;}

  .foot{color:var(--slate); font-size:.84in; line-height:1.5;}
  .foot b{color:var(--ink);}

  .guide{position:absolute; border:6px dashed #FF3B3B; background:rgba(255,59,59,.12);
         color:#FF6B6B; font-size:1.5in; font-weight:800; display:flex;
         align-items:center; justify-content:center;}

  /* the command strip: what was said, and what EON did about it */
  .cmd{display:flex; flex-direction:column; gap:.55in;}
  .cmdrow{display:flex; align-items:flex-start; gap:.85in; background:#fff;
          border:2.5px solid var(--line); border-radius:.45in; padding:.75in .9in;
          box-shadow:0 .10in .30in rgba(14,26,51,.07);}
  .mic{flex:none; width:1.9in; height:1.9in; border-radius:50%;
       background:var(--blue); display:flex; align-items:center; justify-content:center;}
  .said{font-weight:800; font-size:.96in; line-height:1.3; color:var(--ink);}
  .did{font-size:.82in; line-height:1.3; color:var(--teal); font-weight:800; margin-top:.26in;}
  ul.feat2{list-style:none; columns:2; column-gap:1.3in;}
  ul.feat2 li{position:relative; padding-left:1.35in; font-size:.90in; font-weight:600;
              line-height:1.28; margin-bottom:.62in; break-inside:avoid;}
  ul.feat2 li::before{content:""; position:absolute; left:0; top:.26in;
              width:.66in; height:.66in; border-radius:50%; background:var(--blue);}
  .pillars{display:flex; flex-wrap:wrap; gap:.55in;}
  .pillars span{border:2.5px solid #C3D4EA; border-radius:999px;
    padding:.34in .80in; font-size:.62in; font-weight:800; color:var(--slate);
    letter-spacing:.03em; white-space:nowrap;}
  .eyebrow{font-size:.70in; font-weight:900; letter-spacing:.14em;
           text-transform:uppercase; color:var(--teal);}
</style>
</head>
<body>
<div class="wall" id="wall">
  <div class="header"></div>
  <div class="wash"></div>
  <svg class="ghost" viewBox="-50 -50 100 100" aria-hidden="true">
    <circle r="46" fill="none" stroke="#2F62D9" stroke-width="1.4" opacity=".16"/>
    <circle r="33" fill="none" stroke="#2F62D9" stroke-width="1.4" opacity=".12"/>
    <circle r="20" fill="none" stroke="#2F62D9" stroke-width="1.4" opacity=".09"/>
  </svg>
  <div class="safe" id="safe"></div>
</div>

<script>
const GUIDE = new URLSearchParams(location.search).get('guide') === '1';
const TRIM = [70.8, 99.96];
const BLEED = 1;

/* 43" TV: 38 x 21.5 in, top right. Reserved with slack on every side. */
const TV = { x: 28.5, y: 1.0, w: 42.3, h: 27.5 };

const MARK = (d) => `
<svg width="${d}" height="${d}" viewBox="-50 -50 100 100" aria-hidden="true" style="display:block">
  <circle r="46" fill="none" stroke="#118AA8" stroke-width="3.2" opacity=".34"/>
  <circle r="33" fill="none" stroke="#118AA8" stroke-width="3.2" opacity=".56"/>
  <circle r="20" fill="none" stroke="#118AA8" stroke-width="3.2" opacity=".80"/>
  <circle r="8.4" fill="#2F62D9"/>
  <circle cx="26.4" cy="-37.6" r="4.6" fill="#118AA8"/>
  <circle cx="29.1" cy="15.5"  r="4.6" fill="#118AA8"/>
  <circle cx="-18.8" cy="6.8"  r="4.6" fill="#118AA8"/>
  <circle cx="-11.9" cy="-44.4" r="4.6" fill="#118AA8"/>
</svg>`;

const BANGLA = '&#2476;&#2494;&#2434;&#2482;&#2494;';
const Q_BN = '&#2458;&#2482;&#2468;&#2495; &#2478;&#2494;&#2488;&#2503; &#2482;&#2494;&#2477; &#2453;&#2468;?';
const ASK_BN = '&#2438;&#2478;&#2494;&#2453;&#2503; &#2476;&#2494;&#2434;&#2482;&#2494;&#2479;&#2492; '
             + '&#2460;&#2495;&#2460;&#2509;&#2462;&#2503;&#2488; &#2453;&#2480;&#2497;&#2472;&#2404;';

const MIC = () => `
<svg width="1.05in" height="1.05in" viewBox="0 0 24 24" fill="none"
     stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
  <rect x="9" y="2" width="6" height="11" rx="3" fill="#fff" stroke="none"/>
  <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
</svg>`;

const CMD = (said, did) => `
  <div class="cmdrow"><div class="mic">${MIC()}</div>
    <div><div class="said">${said}</div><div class="did">&rarr; ${did}</div></div></div>`;

const BLOCKS = [
  /* ---------------- header band: EON, DIU, and the TV ---------------- */
  { x: 0.8, y: 2.0, w: 8.5, html:
    `<img src="../assets/eon-celebrate-full.png" style="width:100%;display:block" alt="">` },

  { x: 10.0, y: 3.5, html:
    `<div class="word" style="font-size:3.92in">EON</div>
     <div style="font-size:.72in;font-weight:700;color:var(--slate);
                 letter-spacing:.01em;margin-top:.5in;white-space:nowrap">
       One Brain &middot; Multi Decision Layer for your ERP</div>` },


  { x: 10.0, y: 10.4, html:
    `<span class="chip"><img src="../assets/diu-logo.png" alt="Daffodil International University"></span>` },


  { x: 2.0, y: 17.6, w: 26.5, html:
    `<div style="font-size:1.25in;font-weight:600;line-height:1.34;color:var(--slate)">
       An intelligence that truly knows accounting &mdash; ERP, payroll, ledger,
       journal and advanced bookkeeping, to a CA&rsquo;s standard. Just speak: it
       catches every error, posts the entry, and chases the follow-ups by
       itself. Errorless &mdash; and it never forgets.</div>` },

  /* ---------------- band 1: the claim ---------------- */
  { x: 2.0, y: 29.3, html: `<div class="eyebrow" style="font-size:1.75in;letter-spacing:.01em;font-weight:900;line-height:1.04;white-space:nowrap">Dr. Cr. Ledger. Payroll. ERP.</div>` },

  { x: 2.0, y: 31.8, w: 35, html:
    `<div class="hero" style="font-size:2.1in">A chartered accountant<br>inside your ERP.<br><span class="t">Ask anything. Assign anything.</span></div>` },

  { x: 2.0, y: 38.6, w: 34, html:
    `<div class="sub">EON reads <b>every company in the group</b> &mdash; ledgers, payroll, people and cash &mdash; with a chartered accountant&rsquo;s rules built in. Speak in English or <span class="bn">${BANGLA}</span>: it posts the entry, finds the error, reconciles the ledger and tells you what is coming.</div>` },

  /* ---------------- the command strip, the whole argument in three rows --- */
  { x: 2.0, y: 50.2, w: 34, html:
    `<div class="cmd">
      ${CMD('&ldquo;Dr Salary 50,000, Cr Bank.&rdquo;', 'Journal posted. Ledger updated.')}
      ${CMD('<span class="bn">&#2480;&#2494;&#2476;&#2509;&#2476;&#2495;&#2480; &#2454;&#2494;&#2468;&#2494; &#2478;&#2495;&#2482;&#2495;&#2479;&#2492;&#2503; &#2470;&#2494;&#2451;&#2404;</span>',
            'Reconciled &mdash; &#2547;1.4 L already paid in advance.')}
      ${CMD('&ldquo;Who is idle this week?&rdquo;', '7 staff flagged. Evaluations ready.')}
     </div>` },

  /* ---------------- what else it carries ---------------- */
  { x: 2.0, y: 45.2, w: 34, html:
    `<div class="stats" style="gap:.5in">
       <div class="stat"><b style="font-size:2.1in">500K</b><span>context<br>memory</span></div>
       <div class="stat"><b style="font-size:2.1in">1,200</b><span>accounting<br>books known</span></div>
       <div class="stat"><b style="font-size:2.1in">1M</b><span>files<br>read</span></div>
       <div class="stat"><b style="font-size:2.1in;color:#0E86A6">$3.6B</b><span>of errors<br>found</span></div>
     </div>` },
  { x: 2.0, y: 64.5, w: 34, html:
    `<h2 class="sec" style="margin-bottom:.7in">And it also</h2>
     <ul class="feat2">
       <li>Closes the books</li>
       <li>Audits its own entries</li>
       <li>Reconciles banks &amp; parties</li>
       <li>Projects cash and revenue</li>
       <li>Rates every employee</li>
       <li>Updates vendors &amp; agents</li>
     </ul>` },

  /* ---------------- right column: EON speaking, the way in, the proof ---- */
  { x: 38.5, y: 30.0, w: 30, html:
    `<div class="eyebrow" style="margin-bottom:.45in">Just say it out loud</div>
     <div class="bubble">&ldquo;Close the month and show me what is wrong.&rdquo;<span class="sm bn">&#2447;&#2439; &#2478;&#2494;&#2488;&#2503;&#2480; &#2482;&#2494;&#2477;-&#2453;&#2509;&#2487;&#2468;&#2495; &#2470;&#2503;&#2454;&#2494;&#2451;&#2404;</span></div>` },

  { x: 39.5, y: 37.5, w: 11.5, html:
    `<img src="../assets/eon-wave-full.png" style="width:100%;display:block" alt="">` },

  { x: 54.0, y: 38.5, w: 14.5, html:
    `<img class="qr" src="../assets/qr.png" style="width:7.0in;height:7.0in">
     <div style="font-size:1.10in;font-weight:900;line-height:1.14;margin-top:.55in">Ask it<br>yourself</div>
     <div style="font-size:.80in;color:var(--teal);font-weight:800;margin-top:.26in">eon.gulfrabit.com</div>` },

  { x: 38.5, y: 54.5, w: 30.3, html:
    `<img src="../assets/screens/eon-ask-conversation.png"
          style="width:100%;display:block;border:2.5px solid var(--line);
                 border-radius:.4in;box-shadow:0 .12in .36in rgba(14,26,51,.10)">
     <div style="font-size:.66in;font-weight:700;color:var(--teal);margin-top:.42in">
       EON answering in the Command Center</div>` },

  { x: 38.5, y: 77.0, w: 30.3, html:
    `<h2 class="sec">Why you can act on it</h2>
     <div class="note">A <b>working prototype</b>, already running on a live
       12-company ERP. There is <b>no language model</b> inventing a plausible
       paragraph &mdash; EON reads your ledger, applies your own rule and shows the
       working, so a figure here is one you can take to your board.</div>` },


  /* EON again, low and friendly rather than informative */
  { x: 2.0, y: 84.5, w: 7.0, html:
    `<img src="../assets/eon-curious-full.png" style="width:100%;display:block" alt="">` },
  { x: 10.0, y: 87.5, w: 24, html:
    `<div class="bubble notail" style="font-size:.86in"><span class="bn">${ASK_BN}</span></div>` },

  { x: 38.5, y: 90.5, w: 31, html:
    `<div class="foot"><b>Daffodil International University</b> &nbsp;&middot;&nbsp;
      Bangladesh AI Business Summit 2026 &nbsp;&middot;&nbsp; Stall U-13</div>` },
];

const safe = document.getElementById('safe');
for (const b of BLOCKS) {
  const d = document.createElement('div');
  d.className = 'abs';
  d.style.left = b.x + 'in';
  d.style.top = b.y + 'in';
  if (b.w) d.style.width = b.w + 'in';
  d.innerHTML = b.html;
  safe.appendChild(d);
}

if (GUIDE) {
  const SC = { x: 30.5, y: 4.0, w: 38.0, h: 21.5 };   // the real screen, to scale
  const g = document.createElement('div');
  g.className = 'guide';
  g.style.cssText += `left:${TV.x}in;top:${TV.y}in;width:${TV.w}in;height:${TV.h}in;`;
  g.innerHTML = `<div style="position:absolute;top:.7in;left:1.0in;font-size:.95in">
      RESERVED ${TV.w} &times; ${TV.h} in &mdash; keep clear</div>`;
  safe.appendChild(g);

  const scr = document.createElement('div');
  scr.style.cssText = `position:absolute;left:${SC.x}in;top:${SC.y}in;`
    + `width:${SC.w}in;height:${SC.h}in;border:8px solid #FF3B3B;`
    + `background:rgba(255,59,59,.28);display:flex;flex-direction:column;`
    + `align-items:center;justify-content:center;color:#fff;text-align:center;`
    + `font-weight:900;border-radius:.3in;`;
  scr.innerHTML = `<div style="font-size:2.6in;line-height:1">43&quot; TV</div>
    <div style="font-size:1.25in;margin-top:.3in">38 &times; 21.5 in (16:9)</div>
    <div style="font-size:.95in;font-weight:700;margin-top:.45in">
      ${SC.x} in from left &middot; ${SC.y} in from top</div>`;
  safe.appendChild(scr);
}

const wall = document.getElementById('wall');
wall.style.width  = (TRIM[0] + 2 * BLEED) + 'in';
wall.style.height = (TRIM[1] + 2 * BLEED) + 'in';
document.title = 'PANEL-READY';
</script>
</body>
</html>
